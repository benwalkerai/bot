name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests
        run: uv run pytest -v

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Audit dependencies for known vulnerabilities
        run: uv run pip-audit
